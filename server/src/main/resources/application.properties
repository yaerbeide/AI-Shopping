# \u670D\u52A1\u7AEF\u53E3
server.port=9100
server.servlet.context-path: /api
# \u67E5\u770B\u65E5\u5FD7
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# mysql\u6570\u636E\u5E93\u8FDE\u63A5
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3308/shopping_mall?characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
# \u6570\u636E\u5E93\u8FDE\u63A5\u6C60\u4F18\u5316
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# \u6587\u4EF6\u4E0A\u4F20\u5927\u5C0F\u9650\u5236 - \u8BBE\u7F6E\u4E3A10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#\u8FD4\u56DEjson\u7684\u5168\u5C40\u65F6\u95F4\u683C\u5F0F
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.mvc.servlet.load-on-startup=1

File.uploadPath=

mybatis.configuration.map-underscore-to-camel-case=true

# AI model API. Keep disabled until a real API key is configured. （deepseek文本小姐）
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:ark}
ai.base-url=${AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
ai.api-key=${AI_API_KEY:xxxxxxxxxxxxxxxxxxx}
ai.model=${AI_MODEL:deepseek-v4-flash-260425}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
ai.max-tokens=${AI_MAX_TOKENS:800}

# AI vision model API. Used by product AI profile generation.（豆包多模态大人）
ai.vision.enabled=${AI_VISION_ENABLED:true}
ai.vision.base-url=${AI_VISION_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
ai.vision.api-key=${AI_VISION_API_KEY:xxxxxxxxxxxxxxxxxxxxxxx}
ai.vision.model=${AI_VISION_MODEL:doubao-seed-2-0-lite-260428}
ai.vision.temperature=${AI_VISION_TEMPERATURE:0.1}
ai.vision.timeout-seconds=${AI_VISION_TIMEOUT_SECONDS:45}
ai.vision.max-tokens=${AI_VISION_MAX_TOKENS:900}
# Optional public backend URL, for example: https://your-domain.com/api
ai.vision.public-image-base-url=${AI_VISION_PUBLIC_IMAGE_BASE_URL:}
# Local development defaults to Base64 so the vision model can read local uploaded images.
ai.vision.prefer-base64=${AI_VISION_PREFER_BASE64:true}

# AI image generation API. Used by admin product cover generation.
# Default provider is Jimeng 3.0, which uses Volcengine OpenAPI AK/SK signing.
ai.image.enabled=${AI_IMAGE_ENABLED:true}
ai.image.provider=${AI_IMAGE_PROVIDER:jimeng}
ai.image.base-url=${AI_IMAGE_BASE_URL:https://visual.volcengineapi.com}
ai.image.version=${AI_IMAGE_VERSION:2022-08-31}
ai.image.region=${AI_IMAGE_REGION:cn-north-1}
ai.image.service=${AI_IMAGE_SERVICE:cv}
ai.image.access-key=${AI_IMAGE_ACCESS_KEY:your-volcengine-access-key-id-here}
ai.image.secret-key=${AI_IMAGE_SECRET_KEY:xxxxxxxxxxxxxxxxxxxxxxxxxx}
ai.image.req-key=${AI_IMAGE_REQ_KEY:jimeng_t2i_v30}
ai.image.size=${AI_IMAGE_SIZE:1328x1328}
ai.image.response-format=${AI_IMAGE_RESPONSE_FORMAT:url}
ai.image.timeout-seconds=${AI_IMAGE_TIMEOUT_SECONDS:90}
ai.image.poll-interval-millis=${AI_IMAGE_POLL_INTERVAL_MILLIS:3000}
ai.image.poll-max-times=${AI_IMAGE_POLL_MAX_TIMES:20}